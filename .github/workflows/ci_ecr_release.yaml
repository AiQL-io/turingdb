name: Release Image To ECR

# The AiQL fork ships its own TuringDB image to the AiQL AWS account. A tag such as
# v3.0.2+aiql.1 builds the wheel (running the test suite), packages the image the deployment
# runs, smoke-tests it and pushes it to ECR. Docker tags cannot hold "+", so that release is
# published as 3.0.2-aiql.1.
#
# Repository variables: TURINGDB_ECR_ROLE_ARN (the turingdb_github_actions_role_arn output of
# the deployment's Terraform), TURINGDB_ECR_REPOSITORY (the repository name, <environment>-turingdb)
# and optionally AWS_REGION (default us-east-1).

on:
  push:
    tags:
      - 'v*\+aiql.*'

permissions:
  contents: read

jobs:
  build-wheel:
    uses: ./.github/workflows/ci_build.yml
    with:
      os_list: '["ubuntu-24.04-turing"]'
      python_version_list: '["3.14"]'
    secrets: inherit

  image:
    needs: build-wheel
    runs-on: ubuntu-24.04-turing
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "IMAGE_TAG=${VERSION//+/-}" >> "$GITHUB_ENV"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: turingdb-wheel-ubuntu-24.04-turing-py3.14
          path: wheel/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: turingdb:${{ env.IMAGE_TAG }}

      # Starts the container the way the deployment does and waits for the REST port to answer
      - name: Smoke test Docker image
        run: |
          docker run --name turingdb-smoke -d \
            --entrypoint /bin/sh \
            -p 6666:6666 \
            "turingdb:${IMAGE_TAG}" \
            -c 'turingdb start -i 0.0.0.0 -p 6666 -turing-dir /home/ubuntu/.turing -demon; exec sleep infinity'

          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6666/; then
              docker rm -f turingdb-smoke
              exit 0
            fi
            sleep 2
          done

          docker logs turingdb-smoke
          docker rm -f turingdb-smoke
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TURINGDB_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.TURINGDB_ECR_REPOSITORY }}"
          docker tag "turingdb:${IMAGE_TAG}" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"
          echo "Pushed ${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Reclaim disk (self-hosted)
        if: always()
        uses: ./.github/actions/clean-self-hosted-runner
