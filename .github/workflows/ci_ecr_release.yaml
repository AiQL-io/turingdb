name: Release Image To ECR

# The AiQL fork ships its own TuringDB image to the AiQL AWS account. A tag such as
# v3.0.2+aiql.1 builds the wheel, packages the image the deployment runs, smoke-tests it and
# pushes it to ECR. Docker tags cannot hold "+", so that release is published as 3.0.2-aiql.1.
#
# Everything runs on one GitHub-hosted runner, so the job builds the wheel itself instead of
# calling ci_build.yml: that workflow also builds every unit test binary, about 63 GB, which a
# hosted runner's disk cannot hold. Tag a commit whose CI Build run is green.
#
# Repository variables: TURINGDB_ECR_ROLE_ARN (the turingdb_github_actions_role_arn output of
# the deployment's Terraform), TURINGDB_ECR_REPOSITORY (the repository name, <environment>-turingdb)
# and optionally AWS_REGION (default us-east-1).

on:
  push:
    tags:
      - 'v*\+aiql.*'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    # The first run builds LLVM/MLIR from source on 4 cores; later runs restore it from the cache
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      BUILD_JOBS: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      PYTHON_VERSION: '3.14'
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 500

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Compute image tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "IMAGE_TAG=${VERSION//+/-}" >> "$GITHUB_ENV"

      - name: Checkout submodules (shallow)
        run: |
          git submodule update --init --force --depth 1
          git submodule foreach '
            if [ "$name" != "external/AFLplusplus" ]; then
                git submodule update --init --force --recursive --depth 1
            fi
          '

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # hashFiles does not see submodule bumps, and the dependencies are built from the submodules.
      - name: Hash submodule commits
        id: submodules
        run: echo "hash=$(git ls-tree -r HEAD | awk '$2 == "commit"' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v4
        with:
          path: external/dependencies
          key: ubuntu-24.04-dependencies-${{ hashFiles('install_build_tools.sh', 'dependencies.sh', '.gitmodules') }}-${{ steps.submodules.outputs.hash }}

      - name: Install build tools
        run: ./install_build_tools.sh

      - name: Build dependencies
        run: ./dependencies.sh
        env:
          SKIP_BUILD_IF_CACHED: ${{ steps.cache-dependencies.outputs.cache-hit }}

      # actions/cache only saves in its post step, and only when the whole job succeeds, so a
      # failure further down would throw away hours of LLVM build. Save right after it.
      - name: Save dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: external/dependencies
          key: ${{ steps.cache-dependencies.outputs.cache-primary-key }}

      - name: Setup Python
        run: uv python install "$PYTHON_VERSION"

      - name: Build wheel
        run: ./build.sh
        env:
          # setuptools_scm's `git describe --dirty` scans every submodule work tree
          SETUPTOOLS_SCM_SUBPROCESS_TIMEOUT: 300

      - name: Verify wheel installation
        run: |
          uv venv .venv-test --python "$PYTHON_VERSION"
          uv pip install wheel/*.whl --python .venv-test/bin/python
          .venv-test/bin/turingdb --help

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: turingdb:${{ env.IMAGE_TAG }}

      # Starts the container the way the deployment does and waits for the REST port to answer
      - name: Smoke test Docker image
        run: |
          docker run --name turingdb-smoke -d \
            --entrypoint /bin/sh \
            -p 6666:6666 \
            "turingdb:${IMAGE_TAG}" \
            -c 'turingdb start -i 0.0.0.0 -p 6666 -turing-dir /home/ubuntu/.turing -demon; exec sleep infinity'

          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:6666/; then
              docker rm -f turingdb-smoke
              exit 0
            fi
            sleep 2
          done

          docker logs turingdb-smoke
          docker rm -f turingdb-smoke
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TURINGDB_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.TURINGDB_ECR_REPOSITORY }}"
          docker tag "turingdb:${IMAGE_TAG}" "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"
          echo "Pushed ${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
